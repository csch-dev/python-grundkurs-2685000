[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank_account"
version = "1.0.0"
description = "Beispielcode für Python Grundkurs"
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "pytest==8.3.2"
]
license = { text = "LinkedIn Learning Exercise Files License" }
authors = [
    { name = "Carla Schreiber", email = "carla.schreiber@web.de" }
]
keywords = ["python", "grundkurs", "linkedlearning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: LinkedIn Learning Exercise Files License", 
    "Operating System :: OS Independent"
]

[project.urls]
"Homepage" = "https://github.com/csch-dev/python-grundkurs-2685000"

[tool.setuptools.packages.find]
where = ["src"]

[tools.setuptools]
license-files = ["LICENSE"]
